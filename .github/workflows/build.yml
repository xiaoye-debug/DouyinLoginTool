name: Build DYYYLoginBypass

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Theos
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        brew install ldid xz

    - name: Setup iOS SDK
      run: |
        mkdir -p $HOME/theos/sdks
        XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        ln -s "$XCODE_SDK" $HOME/theos/sdks/iPhoneOS.sdk
        echo "SDK linked from: $XCODE_SDK"
        ls -la $HOME/theos/sdks/

    - name: Build tweak (rootless)
      run: |
        make clean
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DYYYLoginBypass-Packages
        path: packages/*.deb
        if-no-files-found: warn

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: packages/*.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}