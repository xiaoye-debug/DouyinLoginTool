name: Build DYYYLoginBypass

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Theos (skip SDK)
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        brew install ldid xz

    - name: Download iOS SDK
      run: |
        mkdir -p $HOME/theos/sdks
        cd $HOME/theos/sdks
        
        # 尝试多个 SDK 源
        echo "尝试下载 iPhoneOS16.5.sdk..."
        
        # 源1: theos/sdks releases
        if ! curl -L -o sdk.tar.gz "https://github.com/theos/sdks/releases/download/iPhoneOS16.5.sdk/iPhoneOS16.5.sdk.tar.gz"; then
          echo "源1失败，尝试源2..."
          
          # 源2: 使用 raw.githubusercontent.com
          if ! curl -L -o sdk.tar.gz "https://raw.githubusercontent.com/xybp888/iOS-SDKs/master/iPhoneOS16.5.sdk.tar.gz"; then
            echo "源2失败，尝试源3..."
            
            # 源3: 使用另一个 SDK 仓库
            if ! curl -L -o sdk.tar.gz "https://github.com/xybp888/iOS-SDKs/releases/download/iPhoneOS16.5.sdk/iPhoneOS16.5.sdk.tar.gz"; then
              echo "所有 SDK 源都失败了"
              exit 1
            fi
          fi
        fi
        
        # 验证文件
        if [ ! -f sdk.tar.gz ] || [ $(stat -f%z sdk.tar.gz) -lt 1000000 ]; then
          echo "SDK 文件下载失败或文件太小"
          exit 1
        fi
        
        # 解压
        tar -xzf sdk.tar.gz
        rm -f sdk.tar.gz
        echo "SDK 下载并解压成功"
        ls -la

    - name: Build tweak (rootless)
      run: |
        make clean
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

    - name: Build tweak (roothide)
      run: |
        make clean
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DYYYLoginBypass-Packages
        path: packages/*.deb
        if-no-files-found: warn

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: packages/*.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}