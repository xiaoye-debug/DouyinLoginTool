name: Build DYYYLoginBypass

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Theos (skip SDK)
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        brew install ldid xz

    - name: Download iOS SDK
      run: |
        mkdir -p $HOME/theos/sdks
        cd $HOME/theos/sdks
        
        echo "下载 iPhoneOS16.5.sdk..."
        
        # 使用 wget 并跟随重定向
        wget --tries=3 --timeout=60 -O sdk.tar.gz \
          "https://github.com/theos/sdks/releases/download/iPhoneOS16.5.sdk/iPhoneOS16.5.sdk.tar.gz" || \
        wget --tries=3 --timeout=60 -O sdk.tar.gz \
          "https://gh.api.99988866.xyz/https://github.com/theos/sdks/releases/download/iPhoneOS16.5.sdk/iPhoneOS16.5.sdk.tar.gz" || \
        wget --tries=3 --timeout=60 -O sdk.tar.gz \
          "https://ghproxy.com/https://github.com/theos/sdks/releases/download/iPhoneOS16.5.sdk/iPhoneOS16.5.sdk.tar.gz"
        
        # 验证文件
        if [ ! -f sdk.tar.gz ]; then
          echo "SDK 文件不存在"
          exit 1
        fi
        
        FILE_SIZE=$(stat -f%z sdk.tar.gz 2>/dev/null || stat -c%s sdk.tar.gz 2>/dev/null)
        echo "文件大小: $FILE_SIZE 字节"
        
        if [ "$FILE_SIZE" -lt 1000000 ]; then
          echo "SDK 文件太小，可能下载失败"
          head -c 100 sdk.tar.gz
          exit 1
        fi
        
        # 解压
        tar -xzf sdk.tar.gz
        rm -f sdk.tar.gz
        echo "SDK 下载并解压成功"
        ls -la

    - name: Build tweak (rootless)
      run: |
        make clean
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

    - name: Build tweak (roothide)
      run: |
        make clean
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DYYYLoginBypass-Packages
        path: packages/*.deb
        if-no-files-found: warn

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: packages/*.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}