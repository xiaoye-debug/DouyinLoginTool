name: Build DYYYLoginBypass

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Theos (skip SDK)
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        brew install ldid xz

    - name: Download iOS SDK
      run: |
        mkdir -p $HOME/theos/sdks
        cd $HOME/theos/sdks
        curl -L -o sdk.tar "https://github.com/xybp888/iOS-SDKs/raw/master/iPhoneOS16.5.sdk.tar.gz" || \
        curl -L -o sdk.tar.gz "https://github.com/theos/sdks/releases/download/iPhoneOS16.5.sdk/iPhoneOS16.5.sdk.tar.gz"
        if [ -f sdk.tar.gz ]; then
          tar -xzf sdk.tar.gz
        elif [ -f sdk.tar ]; then
          tar -xzf sdk.tar
        fi
        rm -f sdk.tar sdk.tar.gz
        ls -la

    - name: Build tweak (rootless)
      run: |
        make clean
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

    - name: Build tweak (roothide)
      run: |
        make clean
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DYYYLoginBypass-Packages
        path: packages/*.deb
        if-no-files-found: warn

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: packages/*.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}