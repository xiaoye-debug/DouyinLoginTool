name: Unzip DYYYLoginBypass

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract ZIP
        run: |
          set -e

          rm -rf /tmp/dyyy_extract
          mkdir -p /tmp/dyyy_extract

          unzip -o DYYYLoginBypass.zip -d /tmp/dyyy_extract

          echo "=== ZIP contents ==="
          find /tmp/dyyy_extract -type f -print

      - name: Copy project files
        run: |
          set -e

          PROJECT="/tmp/dyyy_extract/DYYYLoginBypass"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: DYYYLoginBypass directory not found"
            exit 1
          fi

          # 删除仓库中旧的临时项目文件
          rm -rf \
            DYYYLoginBypass.plist \
            DYYYLoginBypass.xm \
            Sources \
            Makefile \
            control \
            README.md \
            .gitignore

          # 从 ZIP 原样复制项目文件
          cp -R "$PROJECT"/. .

          echo "=== Repository files after extraction ==="
          find . -maxdepth 4 -type f \
            ! -path "./.git/*" \
            -print | sort

      - name: Remove ZIP
        run: |
          rm -f DYYYLoginBypass.zip

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit extracted project
        run: |
          set -e

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract DYYYLoginBypass project"

      - name: Push repository changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:${GITHUB_REF_NAME}